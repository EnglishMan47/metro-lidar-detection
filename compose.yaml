services:
  lidar-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lct26-lidar:humble
    working_dir: /workspace
    environment:
      ROS_DOMAIN_ID: "42"
    shm_size: "512m"
    volumes:
      - .:/workspace
      - ./data/extracted/for_hackathon:/datasets:ro
    stdin_open: true
    tty: true
